[package]
name = "dockerfile_builder"
version = "0.1.4"
edition = "2021"
description = "Flexible Dockerfile builder with type-safe features"
keywords = ["docker", "dockerfile", "dockerfile-builder", "dockerfile-generator"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/simp4t7/dockerfile-builder/"
authors = ["T <simp4t7@gmail.com>"]

[dependencies]
anyhow = "1.0.98"
#dockerfile_builder_macros = "0.1.5"

[dependencies.url]
version = "2.5.4"
default-features = false

[dependencies.dockerfile_builder_macros]
path = "../dockerfile_builder_macros"

[dev-dependencies]
bollard = "0.19.1"
expect-test = "1.5.1"
flate2 = "1.1.2"
tar = "0.4.44"
tokio = {version = "1.45.1", features = ["rt-multi-thread", "macros"]}
futures = "0.3.31"
